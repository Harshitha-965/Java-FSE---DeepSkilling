<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <h2>Student Enrollment Form</h2>

  <br>

  <label>Student Name</label>

  <br>

  <input
    type="text"
    name="studentName"
    [(ngModel)]="studentName"
    required
    minlength="3"
    #nameCtrl="ngModel">
    <br>

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
        Name is required
    </span>

    <br>

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters
    </span>
<br>
  <label>Student Email</label>

  <br>

  <input
    type="email"
    name="studentEmail"
    [(ngModel)]="studentEmail"
    required
    email
    #emailCtrl="ngModel">

  <br><br>

  <label>Course ID</label>

  <br>

  <input
    type="number"
    name="courseId"
    [(ngModel)]="courseId"
    required
    #courseCtrl="ngModel">

  <br><br>

  <label>Preferred Semester</label>

  <br>

  <select
    name="preferredSemester"
    [(ngModel)]="preferredSemester">

    <option value="Odd">Odd</option>
    <option value="Even">Even</option>

  </select>

  <br><br>

  <label>

    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="agreeToTerms"
      required
      #agreeCtrl="ngModel">

    I agree to the Terms & Conditions

  </label>

  <br><br>
  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>
  <button
        type="button"
        (click)="enrollForm.resetForm(); submitted = false">

        Reset

    </button>
  <br><br>

    <div *ngIf="submitted">

        Enrollment request submitted successfully!

    </div>

    

</form>
