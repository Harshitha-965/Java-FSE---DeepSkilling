<form [formGroup]="enrollForm">

    <h2>Reactive Enrollment Form</h2>

    <br>

    <label>Student Name</label>

    <br>

    <input
        type="text"
        formControlName="studentName">

    <br><br>

    <label>Student Email</label>

    <br>

    <input
        type="email"
        formControlName="studentEmail">

    <br>
    <span
        *ngIf="enrollForm.get('studentEmail')?.hasError('emailTaken')
                && enrollForm.get('studentEmail')?.touched">

            Email already taken.

    </span>
<br>

    <label>Course ID</label>

    <br>

    <input
        type="text"
        formControlName="courseId">

    <br>

    <span *ngIf="enrollForm.get('courseId')?.hasError('noCourseCode') && enrollForm.get('courseId')?.touched">
        Course code starting with XX is not allowed.
    </span>

    <br>
    <h3>Additional Courses</h3>

    <button type="button" (click)="addCourse()">
        Add Another Course
    </button>

    <br>

    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">

        <input [formControl]="ctrl">

        <button
            type="button"
            (click)="removeCourse(i)">
            Remove
        </button>

    <br><br>

</div>
    <br>

    <label>Preferred Semester</label>

    <br>

    <select formControlName="preferredSemester">

        <option value="Odd">Odd</option>

        <option value="Even">Even</option>

    </select>

    <br><br>

    <label>

        <input
            type="checkbox"
            formControlName="agreeToTerms">

        I agree to the Terms & Conditions

    </label>

    <br><br>
    <button
        type="submit"
        [disabled]="enrollForm.invalid"
        (click)="onSubmit()">

        Submit

    </button>

</form>
