<div
  appHighlight="lightblue"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left':
      course.gradeStatus === 'passed'
        ? '6px solid green'
        : course.gradeStatus === 'failed'
        ? '6px solid red'
        : '6px solid gray'
  }">

  <h3>{{ course.name }}</h3>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus">

    <span *ngSwitchCase="'passed'">
      🟢 Passed
    </span>

    <span *ngSwitchCase="'failed'">
      🔴 Failed
    </span>

    <span *ngSwitchDefault>
      ⚪ Pending
    </span>

  </div>

  <ng-container *ngIf="enrolledIds$ | async as enrolledIds">

    <button (click)="onEnrollClick()">

      {{ enrolledIds.includes(course.id)
          ? 'Unenroll'
          : 'Enroll' }}

    </button>

  </ng-container>

  <button (click)="toggleDetails()">
    Show Details
  </button>

  <button (click)="onDeleteClick($event)">
    Delete
  </button> 

</div>
